<div class="dash-container">
  <!-- content-aware grid: as many 320–400px cards per row as fit -->
  <div class="metrics-grid">
    <p-card styleClass="metric-card" *ngFor="let m of metrics">
      <div class="metric-card__inner">
        <div class="metric-card__header">
          <span class="metric-card__label">{{ m.label }}</span>
          <span class="metric-card__delta" [ngClass]="m.delta >= 0 ? 'is-up' : 'is-down'">
            <i class="pi" [ngClass]="m.delta >= 0 ? 'pi-arrow-up-right' : 'pi-arrow-down-right'"></i>
            {{ m.delta | number:'1.0-2' }}%
          </span>
        </div>
        <div class="metric-card__value">
          {{ m.value }}<span class="metric-card__unit" *ngIf="m.unit">{{ m.unit }}</span>
        </div>
        <div class="metric-card__sub" *ngIf="m.subtext">{{ m.subtext }}</div>
      </div>
    </p-card>
  </div>
</div>
