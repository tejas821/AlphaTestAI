<div class="grid gap-4">
  <!-- Stat Cards -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <p-card *ngFor="let card of statCards" class="text-center shadow-md">
      <div class="flex flex-col items-center">
        <i [class]="card.icon + ' text-3xl text-primary mb-2'"></i>
        <h3>{{ card.value }}{{ card.suffix || '' }}</h3>
        <p class="text-sm">{{ card.title }}</p>
        <small *ngIf="card.help" class="text-muted">{{ card.help }}</small>
      </div>
    </p-card>
  </div>

  <!-- Charts -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <p-card *ngFor="let chart of charts">
      <h4>{{ chart.title }}</h4>
      <!-- <p-chart type="{{ chart.type }}" [data]="chart.data" [options]="chart.options"></p-chart> -->
    </p-card>
  </div>
</div>
